services:

  auth-db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - auth_service/.env
    environment:
      POSTGRES_PASSWORD: ${DB_AUTH_PASSWORD}
      POSTGRES_USER: ${DB_AUTH_USER}
      POSTGRES_DB: ${DB_AUTH_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_AUTH_USER} -d ${DB_AUTH_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080

  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - auth_service/.env
    environment:
      DB_HOST: auth-db
    ports:
      - "8000:8000"
    volumes:
      - ./auth_service:/app/auth_service
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  pgdata: